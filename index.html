<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OwePay - Debt & Credit Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OwePay" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; padding-bottom: 95px; }
    header { background: #111827; padding: 14px 16px; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .currency-btn { background: #1f2937; color: #9ca3af; border: 1px solid #374151; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .currency-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .container { padding: 16px; max-width: 480px; margin: 0 auto; }
    
    /* Type Nav Tabs */
    .nav-tabs { display: flex; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 9px; font-size: 0.88rem; font-weight: 700; cursor: pointer; background: transparent; color: #9ca3af; transition: all 0.2s ease; }
    .tab-btn.active-owe { background: #ef4444; color: #fff; }
    .tab-btn.active-owed { background: #10b981; color: #fff; }

    /* Summary Card */
    .stats-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 16px; margin-bottom: 18px; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .stat-box { background: #1f2937; border-radius: 12px; padding: 12px; }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin-bottom: 4px; }
    .stat-num-owe { font-size: 1.15rem; font-weight: 800; color: #ef4444; }
    .stat-num-owed { font-size: 1.15rem; font-weight: 800; color: #10b981; }
    .net-box { border-top: 1px solid #374151; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #9ca3af; }
    .net-val { font-weight: 700; font-size: 0.95rem; }

    /* Debt/Credit List Item */
    .debt-item { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .debt-item.settled { border-color: #374151; opacity: 0.65; }
    .debt-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .debt-name { font-size: 1rem; font-weight: 700; color: #fff; }
    .debt-note { font-size: 0.8rem; color: #9ca3af; margin-top: 2px; }
    .debt-badge { padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-owe { background: rgba(239,68,68,0.15); color: #ef4444; }
    .badge-owed { background: rgba(16,185,129,0.15); color: #10b981; }
    .badge-settled { background: rgba(107,114,128,0.2); color: #9ca3af; }
    .debt-balance { font-size: 1.25rem; font-weight: 800; margin: 6px 0; }
    .bal-owe { color: #ef4444; }
    .bal-owed { color: #10b981; }
    
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button.btn { flex: 1; padding: 9px; border-radius: 10px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-pay { background: #ef4444; color: #fff; }
    .btn-collect { background: #10b981; color: #fff; }
    .btn-del { background: #1f2937; color: #ef4444; border: 1px solid #374151 !important; flex: 0 0 44px; }
    
    .fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 440px; border: none; border-radius: 14px; padding: 15px; font-size: 1rem; font-weight: 700; cursor: pointer; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .fab-owe { background: #ef4444; color: #fff; box-shadow: 0 8px 24px rgba(239,68,68,0.35); }
    .fab-owed { background: #10b981; color: #fff; box-shadow: 0 8px 24px rgba(16,185,129,0.35); }
    
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; justify-content: center; align-items: flex-end; }
    .modal-overlay.active { display: flex; }
    .modal-sheet { background: #111827; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px 16px 36px 16px; border-top: 1px solid #374151; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; font-size: 1rem; }
    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .empty-state { text-align: center; padding: 40px 16px; color: #6b7280; font-size: 0.95rem; }
  </style>
</head>
<body>
  <header>
    <h1>💸 OwePay</h1>
    <div style="display: flex; gap: 6px;">
      <button id="currUsd" class="currency-btn active" onclick="setCurrency('USD')">USD ($)</button>
      <button id="currIqd" class="currency-btn" onclick="setCurrency('IQD')">IQD (د.ع)</button>
    </div>
  </header>

  <div class="container">
    <!-- View Switcher -->
    <div class="nav-tabs">
      <button id="tabOwe" class="tab-btn active-owe" onclick="switchTab('owe')">I Owe (Pay)</button>
      <button id="tabOwed" class="tab-btn" onclick="switchTab('owed')">They Owe Me (Collect)</button>
    </div>

    <!-- Summary Box -->
    <div class="stats-card">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">I Need To Pay</div>
          <div class="stat-num-owe" id="sumOweDisplay">$0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">I Need To Collect</div>
          <div class="stat-num-owed" id="sumOwedDisplay">$0</div>
        </div>
      </div>
      <div class="net-box">
        <span>Net Balance (Receivables - Debts):</span>
        <span class="net-val" id="netDisplay">$0</span>
      </div>
    </div>

    <!-- Entries List -->
    <div id="debtsList"></div>
  </div>

  <button id="fabBtn" class="fab fab-owe" onclick="openAddModal()">+ Add Money I Owe</button>

  <!-- Add Record Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="modalTitle" style="font-size: 1.1rem; color: #fff;">Record Money</h2>
        <button onclick="closeModal('addModal')" style="background:none; border:none; color:#9ca3af; font-size: 1.5rem;">✕</button>
      </div>
      
      <div class="form-group">
        <label>Type of Record</label>
        <select id="recordType" onchange="updateModalTypeLabels()">
          <option value="owe">I borrowed money (I Owe)</option>
          <option value="owed">I lent money (They Owe Me)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="personNameLabel">Person's Name</label>
        <input type="text" id="personName" placeholder="e.g. Ahmed, Karwan, Hardware Store" />
      </div>

      <div class="form-group">
        <label>Currency</label>
        <select id="debtCurrency">
          <option value="USD">USD ($)</option>
          <option value="IQD">IQD (د.ع)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Total Amount</label>
        <input type="number" id="debtAmount" placeholder="e.g. 500" />
      </div>

      <div class="form-group">
        <label>Note / Purpose (Optional)</label>
        <input type="text" id="debtNote" placeholder="e.g. Invoices, Personal loan, Car parts" />
      </div>

      <button id="btnSubmitAdd" class="btn-submit" style="background:#ef4444; color:#fff;" onclick="saveRecord()">Save Entry</button>
    </div>
  </div>

  <!-- Repay/Collect Modal -->
  <div class="modal-overlay" id="actionModal">
    <div class="modal-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="actionModalTitle" style="font-size: 1.1rem; color: #fff;">Record Payment</h2>
        <button onclick="closeModal('actionModal')" style="background:none; border:none; color:#9ca3af; font-size: 1.5rem;">✕</button>
      </div>
      <input type="hidden" id="actionEntryId" />
      <div class="form-group">
        <label id="actionPromptText">Amount</label>
        <input type="number" id="actionAmount" placeholder="Enter amount" />
      </div>
      <button id="actionConfirmBtn" class="btn-submit" style="background: #10b981; color:#fff;" onclick="submitPayment()">Confirm</button>
    </div>
  </div>

  <script>
    let records = JSON.parse(localStorage.getItem('owepay_records_v2')) || [];
    let currentCurrency = 'USD';
    let currentTab = 'owe'; // 'owe' or 'owed'

    // Migration helper from v1 if exists
    const oldV1 = localStorage.getItem('my_debts_v1');
    if (oldV1 && records.length === 0) {
      try {
        const parsed = JSON.parse(oldV1);
        records = parsed.map(x => ({ ...x, type: 'owe' }));
        localStorage.setItem('owepay_records_v2', JSON.stringify(records));
      } catch(e) {}
    }

    function saveState() {
      localStorage.setItem('owepay_records_v2', JSON.stringify(records));
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabOwe').className = 'tab-btn' + (tab === 'owe' ? ' active-owe' : '');
      document.getElementById('tabOwed').className = 'tab-btn' + (tab === 'owed' ? ' active-owed' : '');
      
      const fab = document.getElementById('fabBtn');
      if (tab === 'owe') {
        fab.className = 'fab fab-owe';
        fab.innerText = '+ Add Money I Owe';
      } else {
        fab.className = 'fab fab-owed';
        fab.innerText = '+ Add Money Owed To Me';
      }
      render();
    }

    function setCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('currUsd').className = 'currency-btn' + (curr === 'USD' ? ' active' : '');
      document.getElementById('currIqd').className = 'currency-btn' + (curr === 'IQD' ? ' active' : '');
      render();
    }

    function openAddModal() {
      document.getElementById('recordType').value = currentTab;
      updateModalTypeLabels();
      document.getElementById('personName').value = '';
      document.getElementById('debtAmount').value = '';
      document.getElementById('debtNote').value = '';
      document.getElementById('addModal').classList.add('active');
    }

    function updateModalTypeLabels() {
      const type = document.getElementById('recordType').value;
      const title = document.getElementById('modalTitle');
      const label = document.getElementById('personNameLabel');
      const submit = document.getElementById('btnSubmitAdd');

      if (type === 'owe') {
        title.innerText = 'Record Money You Owe';
        label.innerText = 'Who did you borrow from?';
        submit.style.background = '#ef4444';
        submit.innerText = 'Save Debt';
      } else {
        title.innerText = 'Record Money Owed To You';
        label.innerText = 'Who borrowed from you?';
        submit.style.background = '#10b981';
        submit.innerText = 'Save Receivable';
      }
    }

    function openActionModal(id) {
      const item = records.find(x => x.id === id);
      if (!item) return;
      document.getElementById('actionEntryId').value = id;
      const left = Math.max(0, item.amount - (item.paid || 0));
      const sym = item.currency === 'USD' ? '$' : ' د.ع';

      if (item.type === 'owe') {
        document.getElementById('actionModalTitle').innerText = 'Pay Back to ' + item.name;
        document.getElementById('actionPromptText').innerText = 'Amount to pay (' + left.toLocaleString() + sym + ' left)';
        document.getElementById('actionConfirmBtn').style.background = '#ef4444';
        document.getElementById('actionConfirmBtn').innerText = 'Confirm Pay Back';
      } else {
        document.getElementById('actionModalTitle').innerText = 'Collect from ' + item.name;
        document.getElementById('actionPromptText').innerText = 'Amount collected (' + left.toLocaleString() + sym + ' left)';
        document.getElementById('actionConfirmBtn').style.background = '#10b981';
        document.getElementById('actionConfirmBtn').innerText = 'Confirm Collected';
      }

      document.getElementById('actionAmount').value = left;
      document.getElementById('actionModal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function saveRecord() {
      const type = document.getElementById('recordType').value;
      const name = document.getElementById('personName').value.trim();
      const amount = parseFloat(document.getElementById('debtAmount').value);
      const currency = document.getElementById('debtCurrency').value;
      const note = document.getElementById('debtNote').value.trim();

      if (!name || isNaN(amount) || amount <= 0) {
        alert('Please enter a valid name and amount.');
        return;
      }

      records.push({
        id: Date.now().toString(),
        type: type,
        name: name,
        amount: amount,
        paid: 0,
        currency: currency,
        note: note,
        date: new Date().toLocaleDateString()
      });

      closeModal('addModal');
      saveState();
    }

    function submitPayment() {
      const id = document.getElementById('actionEntryId').value;
      const payVal = parseFloat(document.getElementById('actionAmount').value);
      const item = records.find(x => x.id === id);
      if (!item || isNaN(payVal) || payVal <= 0) return;

      item.paid = Math.min(item.amount, (item.paid || 0) + payVal);
      closeModal('actionModal');
      saveState();
    }

    function deleteRecord(id) {
      if (confirm('Delete this record?')) {
        records = records.filter(x => x.id !== id);
        saveState();
      }
    }

    function render() {
      let oweUSD = 0, oweIQD = 0;
      let owedUSD = 0, owedIQD = 0;

      records.forEach(r => {
        const remaining = Math.max(0, r.amount - (r.paid || 0));
        if (r.type === 'owe') {
          if (r.currency === 'USD') oweUSD += remaining;
          else oweIQD += remaining;
        } else {
          if (r.currency === 'USD') owedUSD += remaining;
          else owedIQD += remaining;
        }
      });

      // Update Summary Cards
      const sym = currentCurrency === 'USD' ? '$' : ' د.ع';
      const curOwe = currentCurrency === 'USD' ? oweUSD : oweIQD;
      const curOwed = currentCurrency === 'USD' ? owedUSD : owedIQD;
      const net = curOwed - curOwe;

      document.getElementById('sumOweDisplay').innerText = currentCurrency === 'USD' ? '$' + curOwe.toLocaleString() : curOwe.toLocaleString() + ' د.ع';
      document.getElementById('sumOwedDisplay').innerText = currentCurrency === 'USD' ? '$' + curOwed.toLocaleString() : curOwed.toLocaleString() + ' د.ع';

      const netEl = document.getElementById('netDisplay');
      if (net > 0) {
        netEl.innerText = '+' + (currentCurrency === 'USD' ? '$' + net.toLocaleString() : net.toLocaleString() + ' د.ع');
        netEl.style.color = '#10b981';
      } else if (net < 0) {
        netEl.innerText = '-' + (currentCurrency === 'USD' ? '$' + Math.abs(net).toLocaleString() : Math.abs(net).toLocaleString() + ' د.ع');
        netEl.style.color = '#ef4444';
      } else {
        netEl.innerText = (currentCurrency === 'USD' ? '$0' : '0 د.ع');
        netEl.style.color = '#9ca3af';
      }

      // Filter by Active Tab
      const filtered = records.filter(r => (r.type || 'owe') === currentTab);
      const list = document.getElementById('debtsList');

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No records in "${currentTab === 'owe' ? 'I Owe' : 'They Owe Me'}".<br>Tap the button below to add one.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const remaining = Math.max(0, item.amount - (item.paid || 0));
        const isSettled = remaining === 0;
        const itemSym = item.currency === 'USD' ? '$' : ' د.ع';
        const isOwe = item.type === 'owe';

        return `
          <div class="debt-item ${isSettled ? 'settled' : ''}">
            <div class="debt-header">
              <div>
                <div class="debt-name">${item.name}</div>
                ${item.note ? `<div class="debt-note">${item.note}</div>` : ''}
              </div>
              <span class="debt-badge ${isSettled ? 'badge-settled' : (isOwe ? 'badge-owe' : 'badge-owed')}">
                ${isSettled ? 'Settled' : (isOwe ? 'Pending Pay' : 'Pending Collect')}
              </span>
            </div>
            
            <div class="debt-balance ${isOwe ? 'bal-owe' : 'bal-owed'}">
              ${remaining.toLocaleString()}${itemSym}
              <span style="font-size:0.8rem; color:#9ca3af; font-weight:normal;"> / total ${item.amount.toLocaleString()}${itemSym}</span>
            </div>

            <div class="actions">
              ${!isSettled ? `
                <button class="btn ${isOwe ? 'btn-pay' : 'btn-collect'}" onclick="openActionModal('${item.id}')">
                  ${isOwe ? 'Pay Back' : 'Collect Money'}
                </button>
              ` : ''}
              <button class="btn btn-del" onclick="deleteRecord('${item.id}')">🗑</button>
            </div>
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
